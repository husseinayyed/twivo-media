events {
    worker_connections 1024;
}

http {
    # Resolve Docker service names automatically
    resolver 127.0.0.11 valid=30s;

    # Define rate limiting zones (10MB can track ~160k IPs)
    # i_zone: limit /i/ path to 3 requests/sec
    # o_zone: limit other paths to 5 requests/min
    limit_req_zone $binary_remote_addr zone=i_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=o_zone:10m rate=5r/m;

    # Cache configuration for high-performance image delivery
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=1g;

    server {
        listen 80;

        # Default route
        location / {
            limit_req zone=o_zone burst=5 nodelay;
            return 200 "Welcome to the image proxy service!";
        }

        # Image proxy route
        location ~ ^/i/(.+)$ {
            # Apply rate limiting: allow bursts of 5, process immediately
            limit_req zone=i_zone burst=5 nodelay;

            set $nanoid $1;
            set $img_path "";

            # Lua script to fetch image path from Redis
            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                
                -- Set connection timeout for performance stability
                red:set_timeout(500)
                
                local ok, err = red:connect("redis", 6379)
                if ok then
                    local path, err = red:get(ngx.var.nanoid)
                    if path and path ~= ngx.null then
                        ngx.var.img_path = path
                        -- Reuse connection to prevent socket exhaustion
                        red:set_keepalive(10000, 100)
                    else
                        ngx.exit(404)
                    end
                else
                    ngx.log(ngx.ERR, "Redis connection failed: ", err)
                    ngx.exit(500)
                end
            }

            # Caching strategy
            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status;

            # Forward to internal image processing service
            proxy_pass http://imgproxy:8080/unsafe/$img_path;
        }
    }
}