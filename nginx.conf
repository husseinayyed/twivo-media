events {
    worker_connections 1024;
}

http {
    # Automatically resolve Docker service names
    resolver 127.0.0.11 valid=30s;

    # Shared memory for auth cache (Public Key & JWT Config)
    lua_shared_dict auth_cache 10m;

    # Initialize the Public Key and ENV configurations once at startup for O(1) access
    init_by_lua_block {
        local f = io.open("/app/keys/public.pem", "r")
        if f then
            ngx.shared.auth_cache:set("pub_key", f:read("*all"))
            f:close()
        else
            ngx.log(ngx.ERR, "CRITICAL: Failed to open public.pem at startup")
        end

        ngx.shared.auth_cache:set("jwt_iss", os.getenv("JWT_ISS"))
        ngx.shared.auth_cache:set("jwt_aud", os.getenv("JWT_AUD"))
    }

    # Define rate limiting zones
    limit_req_zone $binary_remote_addr zone=i_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=o_zone:10m rate=5r/m;
    limit_req_log_level warn;

    # Cache configuration for image delivery
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=1g;

    # Dedicated cache zone for Nmap blocks
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=scanner_cache:10m max_size=100m inactive=60m;

    server {
        listen 80;
        
        if ($http_user_agent ~* "Nmap") {
            # 444 is a special non-standard Nginx status code.
            # It instructs the server to close the TCP connection instantly
            # without sending back ANY response headers or data.
            return 444;
        }
        
        # Variables to store the validated payloads
        set $validated_user_id "";
        set $validated_tweet_id "";

        # 1. Applies rate limit and triggers safe 404 for Nmap
        location / {
            limit_req zone=o_zone burst=5 nodelay;

            # Point to a standard location block
            root /usr/local/openresty/nginx/html;

            # Fallback to the named internal location to issue the 404
            try_files $uri =404;
        }

        location /ping {
            limit_req zone=o_zone burst=5 nodelay;
            proxy_pass http://twivo-app:8020/ping;
        }

        # Secure Upload Route
        location = /upload {
            client_max_body_size 20m;
            limit_req zone=o_zone burst=2 nodelay;
            proxy_pass http://twivo-app:8020;
        }

        # Image proxy route (FIXED)
        location ~ ^/i/(.+)$ {
            limit_req zone=i_zone burst=5 nodelay;

            set $nanoid $1;
            set $img_uuid "";
            set $img_type "";
            set $img_width "";
            set $img_height "";

            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(500)

                local ok, err = red:connect("redis", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "REDIS_ERR: Failed to connect to Redis: ", tostring(err))
                    ngx.exit(500)
                end

                local nanoid = ngx.var.nanoid
                local res, err = red:hgetall("nano:" .. nanoid)

                if res and res ~= ngx.null and #res > 0 then
                    local hash = {}
                    for i = 1, #res, 2 do
                        hash[tostring(res[i])] = tostring(res[i+1])
                    end

                    if hash["file_uuid"] and hash["file_type"] and hash["width"] and hash["height"]
                       and hash["file_uuid"] ~= "nil" and hash["file_type"] ~= "nil" then
                        
                        ngx.var.img_uuid = hash["file_uuid"]
                        ngx.var.img_type = hash["file_type"]
                        ngx.var.img_width = hash["width"]
                        ngx.var.img_height = hash["height"]
                        red:set_keepalive(10000, 100)
                    else
                        ngx.log(ngx.ERR, "REDIS_ERR: Missing required hash fields for nanoid: ", nanoid)
                        ngx.exit(404)
                    end
                else
                    ngx.log(ngx.ERR, "REDIS_ERR: Key not found or empty: nano:", nanoid)
                    ngx.exit(404)
                end
            }

            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://imgproxy:8080/unsafe/resize:fit:$img_width:$img_height/f:webp/plain/http://weed-filer:8888/buckets/twivo/$img_uuid$img_type;
        }
    }
}