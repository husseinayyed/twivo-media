events {
    worker_connections 1024;
}

http {
    # Automatically resolve Docker service names
    resolver 127.0.0.11 valid=30s;
    
    # Shared memory for auth cache (Public Key & JWT Config)
    lua_shared_dict auth_cache 10m;

    # Initialize the Public Key and ENV configurations once at startup for O(1) access
    init_by_lua_block {
        local f = io.open("/app/keys/public.pem", "r")
        if f then
            ngx.shared.auth_cache:set("pub_key", f:read("*all"))
            f:close()
        else
            ngx.log(ngx.ERR, "CRITICAL: Failed to open public.pem at startup")
        end
        
        ngx.shared.auth_cache:set("jwt_iss", os.getenv("JWT_ISS"))
        ngx.shared.auth_cache:set("jwt_aud", os.getenv("JWT_AUD"))
    }

    # Define rate limiting zones
    # i_zone: for image proxying
    # o_zone: for general API traffic
    limit_req_zone $binary_remote_addr zone=i_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=o_zone:10m rate=5r/m;

    # Cache configuration for image delivery
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=1g;

    server {
        listen 80;
        
        # Variables to store the validated payloads
        set $validated_user_id "";
        set $validated_tweet_id "";

        location / {
            limit_req zone=o_zone burst=5 nodelay;
            return 200 "Welcome to the image proxy service!";
        }

        # Secure Upload Route
        location = /upload {
            client_max_body_size 10m;
            limit_req zone=o_zone burst=2 nodelay;

            access_by_lua_block {
                local jwt = require "resty.jwt"
                local redis = require "resty.redis"
                
                local auth_header = ngx.req.get_headers()["x-twivo-backend"]
                if not auth_header then 
                    ngx.log(ngx.ERR, "AUTH_FAIL: Missing x-twivo-backend header")
                    ngx.exit(401) 
                end

                local pub_key = ngx.shared.auth_cache:get("pub_key")
                if not pub_key then
                    ngx.log(ngx.ERR, "AUTH_FAIL: Public key is missing from shared dict")
                    ngx.exit(500)
                end

                local jwt_obj = jwt:verify(pub_key, auth_header)
                if not jwt_obj.verified then 
                    ngx.log(ngx.ERR, "AUTH_FAIL: JWT verification failed. Reason: ", jwt_obj.reason or "unknown")
                    ngx.exit(401) 
                end

                local expected_iss = ngx.shared.auth_cache:get("jwt_iss")
                if jwt_obj.payload.iss ~= expected_iss then
                    ngx.log(ngx.ERR, "AUTH_FAIL: Invalid issuer. Got: ", tostring(jwt_obj.payload.iss), " Expected: ", tostring(expected_iss))
                    ngx.exit(401)
                end

                -- 4. التحقق من الـ Audience
                local expected_aud = ngx.shared.auth_cache:get("jwt_aud")
                if jwt_obj.payload.aud ~= expected_aud then
                    ngx.log(ngx.ERR, "AUTH_FAIL: Invalid audience. Got: ", tostring(jwt_obj.payload.aud), " Expected: ", tostring(expected_aud))
                    ngx.exit(401)
                end

                -- 5. الاتصال بـ Redis ومنع الهجمات المكررة (Replay Attacks عبر JTI)
                local red = redis:new()
                red:set_timeout(500)
                local ok, err = red:connect("redis", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "AUTH_FAIL: Redis connection failed: ", tostring(err))
                    ngx.exit(500)
                end
                
                local jti = jwt_obj.payload.jti
                if not jti then
                    ngx.log(ngx.ERR, "AUTH_FAIL: JWT payload missing 'jti' claim")
                    ngx.exit(401)
                end

                local exists, err = red:get("jti:" .. jti)
                if exists and exists ~= ngx.null then
                    ngx.log(ngx.ERR, "AUTH_FAIL: Replay attack detected. JTI already used: ", jti)
                    ngx.exit(401)
                end
                
                -- تسجيل الـ JTI لمدة ساعة لمنع تكراره
                red:setex("jti:" .. jti, 3600, "1")
                red:set_keepalive(10000, 100)

                -- تمرير الـ User ID والـ Tweet ID إلى المتغيرات الداخلية لـ Nginx
                ngx.var.validated_user_id = jwt_obj.payload.sub
                ngx.var.validated_tweet_id = jwt_obj.payload.id
            }

            # Security: Prevent header spoofing and pass the verified data
            proxy_set_header X-Twivo-User-ID "";
            proxy_set_header X-Twivo-User-ID $validated_user_id;
            
            proxy_set_header X-Twivo-Tweet-ID "";
            proxy_set_header X-Twivo-Tweet-ID $validated_tweet_id;

            proxy_pass http://twivo-app:8020;
        }

        # Image proxy route
        location ~ ^/i/(.+)$ {
            limit_req zone=i_zone burst=5 nodelay;

            set $nanoid $1;
            set $img_path "";

            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(500)
                
                local ok, err = red:connect("redis", 6379)
                if ok then
                    local path = red:get(ngx.var.nanoid)
                    if path and path ~= ngx.null then
                        ngx.var.img_path = path
                        red:set_keepalive(10000, 100)
                    else
                        ngx.exit(404)
                    end
                else
                    ngx.exit(500)
                end
            }

            proxy_cache my_cache;
            proxy_cache_valid 200 60m;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://imgproxy:8080/unsafe/$img_path;
        }
    }
}