worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Automatically resolve Docker service names
    resolver 127.0.0.11 valid=30s;
    server_tokens off;
    # Define rate limiting zones
    limit_req_zone $binary_remote_addr zone=image_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=regular_zone:10m rate=5r/m;
    limit_req_log_level warn;

    # 1. Main Application Cache (Using /tmp is fine for temporary/fast storage)
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m inactive=60m max_size=1g;

    # 2. Scanner / Nmap Cache (Unique subdirectory)
    proxy_cache_path /var/cache/nginx/scanners levels=1:2 keys_zone=scanner_cache:10m max_size=100m inactive=60m;

    # 3. Specific Response Cache (Unique subdirectory)
    proxy_cache_path /var/cache/nginx/responses levels=1:2 keys_zone=response_cache:10m max_size=10m inactive=60m;
    server {
        listen 80;

        if ($http_user_agent ~* "Nmap") {
            # 444 is a special non-standard Nginx status code.
            # It instructs the server to close the TCP connection instantly
            # without sending back ANY response headers or data.
            return 444;
        }

        # Variables to store the validated payloads
        set $validated_user_id "";
        set $validated_tweet_id "";

        # Secure Upload Route
        location = /upload {
            limit_except POST {
                deny all;
            }
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache response_cache;
            proxy_cache_methods POST;
            proxy_cache_valid 400 401 405 10m;
            proxy_cache_key "$scheme|$host|$request_method|$request_uri|$http_x_twivo_backend";
            client_max_body_size 20m;
            proxy_set_header X-Cache-Status $upstream_cache_status;
            limit_req zone=upload_zone burst=2 nodelay;
            proxy_pass http://twivo-app:8020;
        }

        # Image proxy route
        location ~ "^/i/(?<img_id>[a-zA-Z0-9_-]{16})/?$" {
            limit_except GET {
                deny all;
            }
            # 1. Trigger the authentication check to your Go backend
            auth_request /_find_image;

            auth_request_set $img_width $upstream_http_x_image_width;
            auth_request_set $img_height $upstream_http_x_image_height;
            auth_request_set $img_type $upstream_http_x_image_type;
            # 3. Disk caching matrix configurations
            proxy_cache response_cache;
            proxy_cache_valid 200 404 10m;
            proxy_cache_key "$scheme|$host|$request_method|$request_uri|$img_id";

            limit_req zone=image_zone burst=5 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://imgproxy:8080/unsafe/resize:fit:$img_width:$img_height/f:webp/plain/http://weed-filer:8888/buckets/twivo/$img_id$img_type;
        }

        location = /_find_image {
            internal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache response_cache;
            proxy_cache_valid 200 404 10m;
            proxy_cache_key "$scheme|$host|$request_method|$request_uri|$img_id";
            limit_req zone=image_zone burst=5 nodelay;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://twivo-app:8020/i/$img_id;
        }


        location / {
            limit_req zone=regular_zone burst=5 nodelay;
            return 404;
        }
    }
}