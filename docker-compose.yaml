version: '3.8'

services:
  gateway:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    depends_on:
      - redis
    networks:
      - twivo-network
  redis:
    image: redis:7-alpine
    container_name: twivo-media-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly no 
      --save "" 
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - twivo-network

  weed-master:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-master
    restart: unless-stopped
    command: master -ip=weed-master
    ports:
      - "9333:9333"
    volumes:
      - seaweed-master-data:/data
    networks:
      - twivo-network

  weed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-volume
    restart: unless-stopped
    command: volume -mserver=weed-master:9333 -port=8085 -max=100 -dir=/data
    ports:
      - "8085:8085"
    volumes:
      - seaweed-volume-data:/data
    depends_on:
      - weed-master
    networks:
      - twivo-network

  weed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-filer
    restart: unless-stopped
    command: filer -master=weed-master:9333
    ports:
      - "8888:8888"
    volumes:
      - seaweed-filer-data:/data
    depends_on:
      - weed-master
      - weed-volume
    networks:
      - twivo-network

  app:
    build:
      context: .
      target: dev  # Use the 'dev' stage from your Dockerfile
    container_name: twivo-app
    restart: unless-stopped
    volumes:
      # Bind your source code for real-time development
      - .:/app
      # Use a named volume for the build folder to avoid host I/O latency
      - build_volume:/app/build
      # Mount your public key as read-only
      - ../twivo-backend/keys/public.pem:/app/keys/public.pem:ro
    environment:
      - REDIS_URL=${REDIS_URL:-tcp://redis:6379}
      - SERVER_PORT=${SERVER_PORT:-8020}
      - SSL_CERT_PATH=/app/keys/public.pem
      - SEAWEEDFS_FILER_URL=${SEAWEEDFS_FILER_URL:-http://weed-filer:8888}
    networks:
      - twivo-network
    # Keeps the container alive while you work
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      redis:
        condition: service_healthy
      weed-filer:
        condition: service_started
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    container_name: imgproxy
    restart: always
    ports:
      - "8000:8080"
    environment:
      # IMGPROXY_KEY: ${IMGPROXY_KEY}
      # IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_INSECURE: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_MAX_SRC_FILE_SIZE: "15728640"
      # Allow unsafe URLs for development (remove in production)
      IMGPROXY_IGNORE_SIGNATURE_ERRORS: "true"
    networks:
      - twivo-network

volumes:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
  build_volume:
networks:
  twivo-network:
    driver: bridge