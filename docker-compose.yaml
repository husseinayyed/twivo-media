version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: twivo-media-redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly no 
      --save "" 
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - twivo-network

  weed-master:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-master
    restart: unless-stopped
    command: master -ip=weed-master
    ports:
      - "9333:9333"
    volumes:
      - seaweed-master-data:/data
    networks:
      - twivo-network

  weed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-volume
    restart: unless-stopped
    command: volume -mserver=weed-master:9333 -port=8085 -max=100 -dir=/data
    ports:
      - "8085:8085"
    volumes:
      - seaweed-volume-data:/data
    depends_on:
      - weed-master
    networks:
      - twivo-network

  weed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: twivo-weed-filer
    restart: unless-stopped
    command: filer -master=weed-master:9333
    ports:
      - "8888:8888"
    volumes:
      - seaweed-filer-data:/data
    depends_on:
      - weed-master
      - weed-volume
    networks:
      - twivo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: twivo-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8020}:8020"
    volumes:
      - .:/app
      - /app/build
      - ../twivo-backend/keys/public.pem:/app/keys/public.pem:ro
    environment:
      - REDIS_URL=${REDIS_URL:-tcp://redis:6379}
      - SERVER_PORT=${SERVER_PORT:-8020}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/app/keys/public.pem}
      - SEAWEEDFS_FILER_URL=${SEAWEEDFS_FILER_URL:-http://weed-filer:8888}
    command: >
      bash -c "
      mkdir -p build && cd build && 
      cmake .. -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release && 
      make -j$(nproc) && 
      ./app
      "
    depends_on:
      redis:
        condition: service_healthy
      weed-filer:
        condition: service_started
    networks:
      - twivo-network

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    container_name: imgproxy
    restart: always
    ports:
      - "8000:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_MAX_SRC_FILE_SIZE: "15728640"
      # Allow unsafe URLs for development (remove in production)
      IMGPROXY_IGNORE_SIGNATURE_ERRORS: "true"
    networks:
      - twivo-network

volumes:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:

networks:
  twivo-network:
    driver: bridge